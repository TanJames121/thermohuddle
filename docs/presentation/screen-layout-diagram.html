<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ThermoHuddle — Screen Layout &amp; Bento UI Blueprint</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121a29;
    --inner: #0d131f;
    --border: #28354e;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f97316;
    --green: #22c55e;
    --blue: #38bdf8;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1600px;
    height: 1000px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .wrap {
    width: 1600px;
    height: 1000px;
    padding: 26px 34px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background:
      radial-gradient(920px 440px at 16% 8%, rgba(249, 115, 22, 0.11), transparent 64%),
      radial-gradient(740px 400px at 85% 15%, rgba(56, 189, 248, 0.08), transparent 64%),
      var(--bg);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .eyebrow {
    font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .specs {
    display: flex;
    gap: 10px;
    font: 600 11.5px ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .spec-pill {
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .spec-pill b { color: var(--ink); }
  svg {
    width: 100%;
    height: 855px;
    display: block;
  }
  .frame { fill: #0e1422; stroke: #334155; stroke-width: 2; rx: 20; }
  .zone { fill: #151f32; stroke: #2c3a55; stroke-width: 1.5; rx: 14; }
  .zone-accent { fill: #1c1922; stroke: #f97316; stroke-width: 1.6; rx: 14; }
  .zone-live { fill: #122126; stroke: #22c55e; stroke-width: 1.5; rx: 14; }
  .zone-sub { fill: #0c121e; stroke: #233047; stroke-width: 1.2; rx: 10; }
  .callout-card { fill: #121a29; stroke: #28354e; stroke-width: 1.4; rx: 14; }
  .badge { fill: #f97316; rx: 7; }
  .badge-txt { font: 700 11px ui-monospace, monospace; fill: #0b0f17; }
  .z-title { font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
  .z-sub { font: 500 11px ui-monospace, monospace; fill: #94a3b8; }
  .c-title { font-size: 13px; font-weight: 700; fill: #f8fafc; }
  .c-body { font-size: 11.5px; fill: #94a3b8; }
  .guide { stroke: #f97316; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; opacity: 0.75; }
  .dim { font: 600 11px ui-monospace, monospace; fill: #38bdf8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">UI/UX Architecture · Desktop Bento Grid &amp; Mobile Stack</div>
      <h1>ThermoHuddle — Screen Layout &amp; Component Hierarchy Blueprint</h1>
    </div>
    <div class="specs">
      <div class="spec-pill">Desktop Grid: <b>1.42fr : 1fr</b></div>
      <div class="spec-pill">Mobile Breakpoint: <b>&le;760px</b></div>
      <div class="spec-pill">Touch Targets: <b>&ge;44&times;44px</b></div>
      <div class="spec-pill">Theme: <b>Obsidian Glass + Light</b></div>
    </div>
  </header>

  <svg viewBox="0 0 1532 855" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
        <circle cx="4" cy="4" r="3" fill="#f97316" />
      </marker>
    </defs>

    <!-- Dimension Labels -->
    <text x="480" y="18" text-anchor="middle" class="dim">DESKTOP SHELL (max-width: 1360px · 2-Column Asymmetric Bento)</text>
    <line x1="20" y1="28" x2="545" y2="28" stroke="#38bdf8" stroke-width="1.2" />
    <text x="282" y="44" text-anchor="middle" class="dim">Left Column (1.42fr) · Spatial &amp; Audio Stage</text>
    <line x1="565" y1="28" x2="940" y2="28" stroke="#38bdf8" stroke-width="1.2" />
    <text x="752" y="44" text-anchor="middle" class="dim">Right Column (1fr) · Telemetry Sheet</text>

    <!-- Desktop Outer Frame -->
    <rect x="20" y="56" width="920" height="780" class="frame" />

    <!-- Zone 1: Floating Glass Topbar -->
    <rect x="38" y="74" width="884" height="66" class="zone" />
    <rect x="52" y="88" width="38" height="38" rx="10" fill="#f97316" />
    <text x="104" y="104" class="z-title">ThermoHuddle · Behavioral Comfort Lab</text>
    <text x="104" y="122" class="z-sub">Logo + Title + RPi 5 Edge Pill + Demo Scenarios + MQTT/Cloud Chip</text>
    <rect x="46" y="79" width="26" height="20" class="badge" /><text x="59" y="93" text-anchor="middle" class="badge-txt">Z1</text>

    <!-- Zone 2: Compact Hero Row -->
    <rect x="38" y="152" width="884" height="68" class="zone" />
    <text x="84" y="182" class="z-title">Hero Headline ("Your flock, in focus.") + Honest Pilot Stamp</text>
    <text x="84" y="202" class="z-sub">Observation-only disclaimer · Thermal sensing &amp; actuation status</text>
    <rect x="46" y="160" width="26" height="20" class="badge" /><text x="59" y="174" text-anchor="middle" class="badge-txt">Z2</text>

    <!-- Zone 3: Live State Banner (Left Col) -->
    <rect x="38" y="234" width="505" height="72" class="zone-live" />
    <circle cx="64" cy="270" r="7" fill="#22c55e" />
    <text x="82" y="264" class="z-title">State &amp; Sample Freshness HUD</text>
    <text x="82" y="284" class="z-sub">Eyes &amp; ears online · Sample age (s) / Floor °C</text>
    <rect x="46" y="239" width="26" height="20" class="badge" /><text x="59" y="253" text-anchor="middle" class="badge-txt">Z3</text>

    <!-- Zone 4: 3D WebGL Spatial Viewport (Left Col) -->
    <rect x="38" y="320" width="505" height="316" class="zone-accent" />
    <rect x="54" y="362" width="473" height="256" class="zone-sub" />
    <text x="82" y="346" class="z-title">01 / THE BROODER — 3D WebGL Spatial Viewport</text>
    <!-- Mini 3D brooder wireframe inside Z4 -->
    <polygon points="150,510 290,445 430,510 290,575" fill="#182236" stroke="#f97316" stroke-width="1.5" />
    <circle cx="260" cy="510" r="6" fill="#22c55e" />
    <circle cx="290" cy="520" r="6" fill="#22c55e" />
    <circle cx="315" cy="500" r="6" fill="#f97316" />
    <circle cx="280" cy="495" r="6" fill="#22c55e" />
    <!-- Viewport HUD & Buttons -->
    <rect x="66" y="374" width="200" height="24" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="76" y="390" class="z-sub">CAMERA POSITIONS / DETECTIONS</text>
    <rect x="355" y="374" width="160" height="28" rx="7" fill="#1e293b" stroke="#475569" />
    <text x="435" y="392" text-anchor="middle" class="z-sub">Feed · Scen · Theme · PNG</text>
    <rect x="66" y="582" width="215" height="24" rx="6" fill="#143322" stroke="#22c55e" />
    <text x="76" y="598" class="z-sub" style="fill:#86efac">ARUCO 4x4 · BOX MAPPED (4/4)</text>
    <rect x="46" y="325" width="26" height="20" class="badge" /><text x="59" y="339" text-anchor="middle" class="badge-txt">Z4</text>

    <!-- Zone 5: Acoustic Strip (Left Col) -->
    <rect x="38" y="648" width="505" height="120" class="zone" />
    <text x="84" y="676" class="z-title">Acoustic Level &amp; Vocalization Chart</text>
    <text x="430" y="676" class="z-title" style="fill:#f97316">-34.1 dBFS</text>
    <!-- Mini gradient bars -->
    <rect x="58" y="706" width="12" height="28" rx="3" fill="#22c55e" />
    <rect x="76" y="696" width="12" height="38" rx="3" fill="#f59e0b" />
    <rect x="94" y="692" width="12" height="42" rx="3" fill="#f97316" />
    <rect x="112" y="702" width="12" height="32" rx="3" fill="#22c55e" />
    <rect x="130" y="710" width="12" height="24" rx="3" fill="#22c55e" />
    <rect x="148" y="698" width="12" height="36" rx="3" fill="#f59e0b" />
    <rect x="166" y="690" width="12" height="44" rx="3" fill="#f97316" />
    <text x="58" y="754" class="z-sub">Healthy · classifier label (88%) · Peak 3120 Hz</text>
    <rect x="46" y="654" width="26" height="20" class="badge" /><text x="59" y="668" text-anchor="middle" class="badge-txt">Z5</text>

    <!-- Zone 6 & 7: Right Bento Telemetry Sheet -->
    <rect x="558" y="234" width="364" height="534" class="zone" />
    <!-- Z6 Segmented Nav -->
    <rect x="570" y="246" width="340" height="48" class="zone-sub" />
    <text x="740" y="274" text-anchor="middle" class="z-sub" style="fill:#f8fafc">Overview · History · Analytics · Logs · Warn</text>
    <rect x="566" y="239" width="26" height="20" class="badge" /><text x="579" y="253" text-anchor="middle" class="badge-txt">Z6</text>

    <!-- Z7 Sub-modules -->
    <rect x="572" y="308" width="164" height="82" class="zone-sub" />
    <text x="586" y="334" class="z-sub">Detections</text>
    <text x="586" y="366" class="z-title" style="font-size:20px">16 chicks</text>
    <rect x="746" y="308" width="164" height="82" class="zone-sub" />
    <text x="760" y="334" class="z-sub">Mic Level</text>
    <text x="760" y="366" class="z-title" style="font-size:20px">-34.1 dBFS</text>

    <rect x="572" y="402" width="338" height="68" class="zone-sub" />
    <text x="586" y="427" class="z-title">Spatial Descriptors (3-Col Bento)</text>
    <text x="586" y="449" class="z-sub">NND · Shannon Entropy · Clark R · Max Cell</text>

    <rect x="572" y="482" width="338" height="76" class="zone-sub" />
    <text x="586" y="507" class="z-title">ArUco 4-Corner Matrix &amp; Clumping Strip</text>
    <text x="586" y="530" class="z-sub">ID 0..3 Lock Pills · Close Pairs · Dispersion State</text>

    <rect x="572" y="570" width="338" height="92" class="zone-sub" />
    <text x="586" y="595" class="z-title">ESP32 Sensor Grid (2&times;2 Bento)</text>
    <text x="586" y="618" class="z-sub">DHT22 Temp (°C) · RH (%) · MQ-137 NH₃ · Relay Fan</text>
    <text x="586" y="640" class="z-sub">+ Hardware Bus &amp; Honest Observation Notice</text>

    <rect x="572" y="674" width="338" height="78" class="zone-sub" />
    <text x="586" y="700" class="z-title">Behavioral Reasoning Card (#whycard)</text>
    <text x="586" y="724" class="z-sub">Explains spatial pattern + safety boundary</text>
    <rect x="566" y="304" width="26" height="20" class="badge" /><text x="579" y="318" text-anchor="middle" class="badge-txt">Z7</text>

    <!-- Zone 8: Footer -->
    <rect x="38" y="780" width="884" height="42" class="zone" />
    <text x="84" y="806" class="z-sub">Provenance Footer · Transport Status · Last Sample Age · Received Audio Count</text>
    <rect x="46" y="790" width="26" height="20" class="badge" /><text x="59" y="804" text-anchor="middle" class="badge-txt">Z8</text>

    <!-- Guide Connectors to Right Callouts -->
    <path d="M 922 107 L 975 107" class="guide" marker-start="url(#dot)" />
    <path d="M 922 390 L 975 240" class="guide" marker-start="url(#dot)" />
    <path d="M 922 520 L 975 370" class="guide" marker-start="url(#dot)" />
    <path d="M 922 615 L 975 500" class="guide" marker-start="url(#dot)" />

    <!-- Right Panel: Zone Callout Cards + Mobile Wireframe -->
    <g transform="translate(975, 56)">
      <rect width="535" height="96" class="callout-card" />
      <text x="20" y="28" class="c-title">Z1–Z3 · Command Header &amp; Freshness HUD</text>
      <text x="20" y="50" class="c-body">Floating frosted-glass bar keeps Edge Status, Scenario Palette,</text>
      <text x="20" y="69" class="c-body">and Cloud/MQTT transport reachable; 30s staleness guard on banner.</text>
    </g>

    <g transform="translate(975, 168)">
      <rect width="535" height="114" class="callout-card" />
      <text x="20" y="28" class="c-title">Z4–Z5 · Interactive 3D Stage &amp; Acoustic Strip</text>
      <text x="20" y="50" class="c-body">p5.js WebGL brooder reconstructs detected chick coordinates, ArUco</text>
      <text x="20" y="69" class="c-body">corner locks, and thermal gradients; 36-bar dBFS strip tracks audio</text>
      <text x="20" y="88" class="c-body">without fabricating synthetic waveforms.</text>
    </g>

    <g transform="translate(975, 298)">
      <rect width="535" height="114" class="callout-card" />
      <text x="20" y="28" class="c-title">Z6–Z7 · Multi-Page Bento Sheet &amp; Sensor Matrix</text>
      <text x="20" y="50" class="c-body">Segmented navigation switches between Overview, History (gradient</text>
      <text x="20" y="69" class="c-body">area chart), Analytics (F1/resp/stab + CSV), Field Log, and Warnings.</text>
      <text x="20" y="88" class="c-body">Tabular monospace numerals prevent layout jitter during live updates.</text>
    </g>

    <g transform="translate(975, 428)">
      <rect width="535" height="96" class="callout-card" />
      <text x="20" y="28" class="c-title">Z8 &amp; Modal · Scenario Command Palette</text>
      <text x="20" y="50" class="c-body">Centered frosted-glass overlay lets presenters trigger Comfy, Cold,</text>
      <text x="20" y="69" class="c-body">Hot, Draft, Crowding, Lamp Fail, or NH₃ Spike cleanly on demand.</text>
    </g>

    <!-- Mobile Responsive Stack Mini-Frame -->
    <g transform="translate(975, 542)">
      <rect width="535" height="294" class="callout-card" />
      <text x="22" y="30" class="c-title">Responsive Mobile Stack (&le; 760px · Zero Horizontal Overflow)</text>
      <text x="22" y="50" class="c-body">Collapses 2-column Bento grid into vertical single-column cards:</text>

      <!-- Mini Phone Frame -->
      <rect x="26" y="66" width="166" height="212" rx="18" fill="#0b0f17" stroke="#475569" stroke-width="2" />
      <rect x="38" y="80" width="142" height="22" rx="6" fill="#151f32" stroke="#334155" />
      <text x="109" y="95" text-anchor="middle" class="z-sub" style="font-size:9px">Topbar + MQTT</text>
      <rect x="38" y="108" width="142" height="22" rx="6" fill="#122126" stroke="#22c55e" />
      <text x="109" y="123" text-anchor="middle" class="z-sub" style="font-size:9px">State Banner</text>
      <rect x="38" y="136" width="142" height="58" rx="8" fill="#1c1922" stroke="#f97316" />
      <text x="109" y="169" text-anchor="middle" class="z-sub" style="font-size:9px">3D Viewport (295px)</text>
      <rect x="38" y="200" width="142" height="26" rx="6" fill="#151f32" stroke="#334155" />
      <text x="109" y="217" text-anchor="middle" class="z-sub" style="font-size:9px">Audio Bar Chart</text>
      <rect x="38" y="232" width="142" height="34" rx="6" fill="#151f32" stroke="#38bdf8" />
      <text x="109" y="253" text-anchor="middle" class="z-sub" style="font-size:9px">5-Tab Sheet + KPIs</text>

      <!-- Mobile Rules List -->
      <text x="218" y="96" class="c-title">Verified Breakpoints</text>
      <text x="218" y="122" class="c-body">&#8226; 1440px — Full Bento Grid + 390px 3D Stage</text>
      <text x="218" y="148" class="c-body">&#8226; 1024px — Compact Split (1.15fr : 1fr)</text>
      <text x="218" y="174" class="c-body">&#8226; 768px  — Tablet Split · 44px Controls</text>
      <text x="218" y="200" class="c-body">&#8226; 375px  — Single Column · 2-Col Stat Tiles</text>
      <text x="218" y="238" class="z-sub" style="fill:#22c55e">scrollWidth &le; innerWidth enforced at all 4 widths</text>
      <text x="218" y="260" class="z-sub" style="fill:#94a3b8">prefers-reduced-motion disables transitions cleanly</text>
    </g>
  </svg>
</div>
</body>
</html>
